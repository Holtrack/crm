services:
  postgres:
    image: postgres:16-alpine
    container_name: crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - crm_pgdata:/var/lib/postgresql/data
    networks:
      - caddy
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME} -d ${DB_NAME}']
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build: ./backend
    container_name: crm-migrate
    restart: "no"
    env_file: .env
    environment:
      PORT: 3000
    command: ["node", "dist/database/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - caddy

  crm-backend:
    build: ./backend
    container_name: crm-backend
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3000
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - caddy

  crm-frontend:
    build: ./frontend
    container_name: crm-frontend
    restart: unless-stopped
    environment:
      VITE_PROXY_TARGET: ${VITE_PROXY_TARGET}
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS}
    depends_on:
      - crm-backend
    networks:
      - caddy

volumes:
  crm_pgdata:

networks:
  caddy:
    external: true
