services:
  postgres:
    image: postgres:16-alpine
    container_name: crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-crm}
    volumes:
      - crm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-crm}']
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build: ./backend
    container_name: crm-migrate
    restart: "no"
    env_file: .env
    command: ["node", "dist/database/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./backend
    container_name: crm-backend
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    env_file: .env
    environment:
      PORT: 3000
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    container_name: crm-frontend
    restart: unless-stopped
    ports:
      - '${FRONTEND_PORT:-80}:80'
    environment:
      VITE_PROXY_TARGET: ${VITE_PROXY_TARGET:-http://backend:3000}
    depends_on:
      - backend

volumes:
  crm_pgdata:
